<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=794, initial-scale=1" />
<title>Birthday Offer — Louder Club</title>
<style>
  :root {
    --black: #0A0A0A;
    --white: #FFFFFF;
    --gray: #86868B;
    --blue: #723CF4; /* electric violet — Louder. primary, site-wide */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 794px;
    height: 1123px;
    overflow: hidden;
  }
  body {
    background: var(--black);
    color: var(--white);
    font-family: "Arial Black", "Helvetica Neue", Helvetica, Arial, sans-serif;
    position: relative;
    display: flex;
    flex-direction: column;
    padding: 72px 56px;
  }
  /* Decorative glow — top-right + balancing bottom-left */
  body::before {
    content: "";
    position: absolute;
    top: -160px; right: -160px;
    width: 540px; height: 540px;
    background: radial-gradient(circle, rgba(114,60,244,0.30) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: "";
    position: absolute;
    bottom: -200px; left: -180px;
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(114,60,244,0.16) 0%, transparent 70%);
    pointer-events: none;
  }
  .kicker {
    display: inline-block;
    align-self: flex-start;
    background: var(--blue);
    color: var(--white);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    padding: 12px 18px;
    border-radius: 999px;
  }
  .title {
    margin-top: 52px;
    font-size: 96px;
    line-height: 0.86;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.03em;
  }
  .title .stroke {
    color: transparent;
    -webkit-text-stroke: 2px var(--white);
  }
  .offer {
    margin-top: 64px;
    border: 1px solid rgba(255,255,255,0.14);
    background: linear-gradient(180deg, rgba(114,60,244,0.10), transparent);
    padding: 48px;
    position: relative;
    border-radius: 14px;
    overflow: hidden;
  }
  .offer::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 6px;
    background: var(--blue);
  }
  .offer .label {
    font-size: 14px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--gray);
    font-weight: 700;
  }
  .offer .big {
    margin-top: 16px;
    font-size: 78px;
    line-height: 0.9;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
    color: var(--white);
  }
  .offer .big span { color: var(--blue); }
  .offer .sub {
    margin-top: 22px;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 19px;
    line-height: 1.55;
    font-weight: 500;
    color: rgba(255,255,255,0.72);
    max-width: 46ch;
  }
  .footer {
    margin-top: auto;
    padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.14);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .footer .brand {
    font-size: 32px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -0.02em;
  }
  .footer .brand span { color: var(--blue); }
  .footer .meta {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gray);
    text-align: right;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <span class="kicker">Celebrate In Style</span>

  <h1 class="title">Birthdays<br /><span class="stroke">Made</span><br />Memorable</h1>

  <div class="offer">
    <div class="label">The Birthday Offer</div>
    <div class="big">Double Pass<br /><span>On Us</span></div>
    <p class="sub">It's your night. Bring the crew and let us handle the rest — then upgrade to a VIP booth for the ultimate celebration.</p>
  </div>

  <div class="footer">
    <div class="brand">Louder<span>.</span>Club</div>
    <div class="meta">
      Every Saturday · Therapy<br />
      L3 Nightclubs · Crown, Melbourne
    </div>
  </div>
</body>
</html>
